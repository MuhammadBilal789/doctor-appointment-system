version: '3.8'

services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: nestjs-app
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - APP_PORT=3000
      - DATABASE_URI=mongodb://mongo:27017/doctor-appointment-system
    depends_on:
      - mongo
    command: ["npm", "run", "start:dev"]

  mongo:
    image: mongo:6.0
    container_name: nestjs-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: